<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gang Beasts</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-container { position: relative; width: 100vw; height: 100vh; background: #000 !important; }
      #unity-canvas { background: #000 !important; outline: none; display: block; width: 100% !important; height: 100% !important; max-width: none; max-height: none; }
      #unity-footer, #unity-mobile-warning, #unity-loading-bar { display: none !important; }
      #gamehub-loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #000; color: #fff; font: 700 15px Arial, sans-serif; text-align: center; }
      #gamehub-loading .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #f0b400; border-radius: 50%; animation: gamehub-spin .8s linear infinite; }
      #gamehub-loading .detail { min-height: 18px; color: #aaa; font-size: 13px; font-weight: 400; }
      #gamehub-loading #gamehub-progress { width: min(320px, 70vw); height: 12px; border: 1px solid #555; display: block; }
      #gamehub-loading #gamehub-progress-fill { width: 0%; height: 100%; background: #f0b400; transition: width .12s linear; }
      @keyframes gamehub-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="gamehub-loading" role="status"><div class="spinner"></div><div id="gamehub-loading-title">DOWNLOADING...</div><div id="gamehub-loading-detail" class="detail">Preparing game files...</div><div id="gamehub-progress"><div id="gamehub-progress-fill"></div></div></div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Gang Beasts</div>
      </div>
    </div>
    <script src="game-data.js"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLValidation.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGLValidation.data",
        frameworkUrl: buildUrl + "/WebGLValidation.framework.js",
        codeUrl: buildUrl + "/WebGLValidation.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Boneloaf",
        productName: "Gang Beasts",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileWarning = document.querySelector("#unity-mobile-warning");
      var gamehubLoading = document.querySelector("#gamehub-loading");
      var gamehubTitle = document.querySelector("#gamehub-loading-title");
      var gamehubDetail = document.querySelector("#gamehub-loading-detail");
      var gamehubFill = document.querySelector("#gamehub-progress-fill");
      var loadedByFile = {};
      var totalPreload = 0;
      function mb(bytes) { return (bytes / 1048576).toFixed(1); }
      function reportDownload() {
        var loaded = Object.values(loadedByFile).reduce((a, b) => a + b, 0);
        var pct = totalPreload ? loaded / totalPreload : 0;
        gamehubTitle.textContent = "DOWNLOADING...";
        gamehubFill.style.width = Math.min(100, pct * 100).toFixed(1) + "%";
        gamehubDetail.textContent = "Downloading game files... " + mb(loaded) + " / " + mb(totalPreload) + " MB (" + Math.floor(pct * 100) + "%)";
      }

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        // Avoid draining fillrate performance on mobile devices,
        // and default/override low DPI mode on mobile browsers.
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        // game-data.js has already overridden window.fetch ( + XHR shim) so
        // requests for Build/WebGLValidation.data and .wasm are reconstructed
        // from their <=20MB parts. Keep the original config URLs unchanged.
        var manifestSizes = null;
        Promise.all([
          fetch("Build/data-manifest.json").then((r) => r.json()),
          fetch("Build/wasm-manifest.json").then((r) => r.json()),
        ]).then((manifests) => {
          manifestSizes = {};
          manifestSizes["build/webglvalidation.data"] = manifests[0].size;
          manifestSizes["build/webglvalidation.wasm"] = manifests[1].size;
        }).catch(() => {}).finally(() => {
          totalPreload = manifestSizes
            ? manifestSizes["build/webglvalidation.data"] + manifestSizes["build/webglvalidation.wasm"]
            : 0;
          // Progress from chunk reassembly (0% -> 80%), Unity drives 80% -> 100%.
          window.fetch.onProgress = (key, fraction, loaded, total) => {
            if (!totalPreload) return;
            loadedByFile[key] = loaded;
            reportDownload();
            progressBarFull.style.width = (80 * loaded / totalPreload) + "%";
          };
          createUnityInstance(canvas, config, (progress) => {
            gamehubTitle.textContent = "LOADING...";
            gamehubFill.style.width = Math.round(80 + 20 * progress) + "%";
            gamehubDetail.textContent = "Starting game... " + Math.round(progress * 100) + "%";
            progressBarFull.style.width = (80 + 20 * progress) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            gamehubLoading.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((error) => {
            console.error(error);
            gamehubTitle.textContent = "FAILED TO LOAD";
            gamehubDetail.textContent = error && error.message ? error.message : String(error);
            alert("No se pudo cargar el juego. Recarga para volver a intentarlo. " + error.message);
          });
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
